<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pre-Connect Example</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mundorum/oid/oid.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@mundorum/oid/oid.min.js"></script>
</head>
<body>
  <h1>Pre-Connect Example</h1>
  <p>Show a text file with Publish/Subscribe to compare with Connect.</p>

  <file-oid publish="dispatch~file/loaded">
  </file-oid>

  <console-oid prompt="" subscribe="file/loaded~display">
  </console-oid>
</body>
</html>
